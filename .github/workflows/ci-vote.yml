name: CI - Vote Service

on:
  push:
    branches: [main]
    paths:
      - 'vote/**'
  pull_request:
    branches: [main]
    paths:
      - 'vote/**'

jobs:
  test-and-build:
    name: Test & Build Vote
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🧪 Run Unit Tests
        working-directory: vote
        run: mvn test

      - name: 🏗️ Build Package (JAR)
        working-directory: vote
        run: mvn clean package -DskipTests

      - name: 🔑 Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: vote
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vote:latest
            ${{ secrets.DOCKER_USERNAME }}/vote:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/vote:v1.${{ github.run_number }}
