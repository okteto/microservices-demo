name: CI - Worker Service

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'

jobs:
  test-and-build:
    name: Test & Build Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: worker/go.sum

      - name: 🧪 Run Unit Tests
        working-directory: worker
        run: go test -v ./...

      - name: 🏗️ Build Binary
        working-directory: worker
        run: go build -v ./...

      - name: 🔑 Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: worker
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/worker:latest
            ${{ secrets.DOCKER_USERNAME }}/worker:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/worker:v1.${{ github.run_number }}
