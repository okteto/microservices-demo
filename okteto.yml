icon: https://github.com/okteto/microservices-demo/raw/main/vote-icon.png

build:
  result:
    context: result
    dockerfile: Dockerfile

  vote:
    context: vote
    dockerfile: Dockerfile

  worker:
    context: worker
    dockerfile: Dockerfile

  dev:
    context: worker
    dockerfile: Dockerfile
    target: dev

  vote-dev:
    context: vote
    dockerfile: Dockerfile
    target: dev

deploy:
  - helm upgrade --install infrastructure infrastructure/
  - helm upgrade --install vote vote/chart --set image=${OKTETO_BUILD_VOTE_IMAGE}
  - helm upgrade --install result result/chart --set image=${OKTETO_BUILD_RESULT_IMAGE}
  - helm upgrade --install worker worker/chart --set image=${OKTETO_BUILD_WORKER_IMAGE}

forward:
  - 5432:postgresql:5432

dev:
  vote:
    image: ${OKTETO_BUILD_VOTE_DEV_IMAGE}
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    sync:
      - ./vote:/app
    forward:
    - 5005:5005
    persistentVolume:
      enabled: false

  result:
    command: node --inspect=0.0.0.0:9229 server.js
    sync:
      - ./result:/app
    forward:
      - 9229:9229
    persistentVolume:
      enabled: false

  worker:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    command: make debug
    securityContext:
      capabilities:
        add:
        - SYS_PTRACE
    sync:
      - ./worker:/app
    forward:
      - 2345:2345
    persistentVolume:
      enabled: false



test:
  unit:
    image: node:22.12.0-slim
    caches:
      - /root/.npm
    commands:
      - cd result && npm install && npm test

  e2e:
    image: node:22.12.0-slim
    caches:
      - /root/.npm
    commands:
      - cd e2e && npm install && npm test